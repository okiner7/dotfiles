# Конфиг Kitty.
# wallust.conf обновляется скриптом wal-set.sh при смене обоев.

include ~/.config/kitty/wallust.conf

# Всегда запускать zsh, даже если графическая сессия унаследовала SHELL=bash.
shell /usr/bin/zsh

# Плавный курсор: хвост, догоняющий каретку при перемещении.
# Значение — задержка в мс: каретка должна постоять столько, чтобы включилась анимация.
cursor_trail 300

font_size 11.0
window_padding_width 8
enable_audio_bell no
confirm_os_window_close 0

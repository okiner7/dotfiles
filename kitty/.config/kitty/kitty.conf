# Конфиг Kitty.
# wallust.conf обновляется скриптом wal-set.sh при смене обоев.

include ~/.config/kitty/wallust.conf

# Всегда запускать zsh, даже если графическая сессия унаследовала SHELL=bash.
shell /usr/bin/zsh

font_size 11.0
window_padding_width 8
enable_audio_bell no
confirm_os_window_close 0

# wallust v3.5: палитра из кадра видео-обоев.
# Кадр извлекается в ~/.cache/wal-set/frame.png скриптом wal-set.sh.
# Цвета получают kitty, zsh, GTK (Thunar) и рамки Hyprland.

backend     = "fastresize"
color_space = "salience"
palette     = "saliencedark"

# Читаемая контрастность относительно фона.
check_contrast = true

[templates]
kitty = { template = 'kitty.conf',      target = '~/.config/kitty/wallust.conf' }
zsh   = { template = 'zsh-colors.zsh',  target = '~/.config/zsh/wallust-colors.zsh' }
gtk   = { template = 'gtk.css',         target = '~/.config/gtk-3.0/gtk.css' }
hypr  = { template = 'colors.lua',      target = '~/.config/hypr/modules/colors.lua' }
quickshell = { template = 'quickshell.json', target = '~/.config/quickshell/colors.json' }

[hooks]
# Перечитать конфиг во всех запущенных Kitty.
kitty_reload = "pkill -SIGUSR1 -x kitty || true"
